<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祁煜 0306 生日快樂</title>

<style>
:root{
  --bg-gradient: linear-gradient(135deg,#e0c3fc 0%,#8ec5fc 100%);
  --accent-color:#7a5ba0;
  --white:#fff;
}

body,html{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg-gradient);
}

/* 影片容器 */
#media-container{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* 倒數 */
.coming-soon{
  color:#fff;
  font-size:3rem;
  font-weight:800;
  text-shadow:0 4px 15px rgba(0,0,0,.25);
}

#timer{
  color:#fff;
  font-size:1.9rem;
  margin-top:10px;
}

/* 影片播放器 */
#bg-video{
  display:none;
  width:min(900px,90vw);
  max-height:80vh;
  object-fit:contain;
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

/* 彈幕 */
#danmu-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:80%;
  pointer-events:none;
  overflow:hidden;
}

.danmu{
  position:absolute;
  white-space:nowrap;
  font-size:1.5rem;
  font-weight:800;
  color:#fff;
  text-shadow:2px 2px 10px rgba(0,0,0,.55);
  animation:move linear forwards;
}

@keyframes move{
  from{transform:translateX(110vw);}
  to{transform:translateX(-120%);}
}

/* 彈幕開關 */
.danmu-toggle{
  position:fixed;
  top:14px;
  right:14px;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.35);
  color:#fff;
  border:1px solid rgba(255,255,255,.25);
  font-weight:800;
  cursor:pointer;
}

</style>
</head>

<body>

<div id="media-container">

  <div id="countdown-ui">
    <div class="coming-soon">敬請祁待</div>
    <div id="timer">Loading...</div>
  </div>

  <video id="bg-video" loop playsinline controls>
    <source src="vdo.mp4" type="video/mp4">
  </video>

</div>

<div id="danmu-overlay"></div>

<button id="danmuToggleBtn" class="danmu-toggle">彈幕：開</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
  getDatabase, ref, onChildAdded, query, limitToLast
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

const VIDEO_SWITCH_AT = new Date("2026-03-12T00:00:00+08:00").getTime();

const firebaseConfig = {
apiKey:"AIzaSyCsXDi3XafLhOY0Bwq47s-_s-f3rwGJhAk",
authDomain:"rafayel-c806e.firebaseapp.com",
databaseURL:"https://rafayel-c806e-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"rafayel-c806e",
storageBucket:"rafayel-c806e.firebasestorage.app",
messagingSenderId:"121278015626",
appId:"1:121278015626:web:26ba3ca3be10b76b782573"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const messagesRef=ref(db,"blessings");

const countdownUI=document.getElementById("countdown-ui");
const timerEl=document.getElementById("timer");
const videoEl=document.getElementById("bg-video");
const overlay=document.getElementById("danmu-overlay");
const toggleBtn=document.getElementById("danmuToggleBtn");

let videoShown=false;

function formatCountdown(ms){
const d=Math.floor(ms/(1000*60*60*24));
const h=Math.floor((ms%(1000*60*60*24))/(1000*60*60));
const m=Math.floor((ms%(1000*60*60))/(1000*60));
const s=Math.floor((ms%(1000*60))/1000);
return `${d}天 ${h}:${m}:${s}`;
}

async function showVideo(){
if(videoShown)return;
videoShown=true;
countdownUI.style.display="none";
videoEl.style.display="block";

await videoEl.play().catch(()=>{});
}

function updateCountdown(){
const diff=VIDEO_SWITCH_AT-Date.now();

if(diff<=0){
showVideo();
return;
}

timerEl.innerText=formatCountdown(diff);
}

setInterval(updateCountdown,1000);
updateCountdown();

/* 彈幕開關 */

let danmuVisible=true;

toggleBtn.onclick=()=>{
danmuVisible=!danmuVisible;
overlay.style.display=danmuVisible?"block":"none";
toggleBtn.textContent=danmuVisible?"彈幕：開":"彈幕：關";
};

/* 彈幕生成 */

function createDanmu(text){

const div=document.createElement("div");
div.className="danmu";
div.textContent=text;

const top=Math.random()*70+5;
const duration=7+Math.random()*6;

div.style.top=`${top}%`;
div.style.animationDuration=`${duration}s`;

overlay.appendChild(div);

setTimeout(()=>div.remove(),duration*1000);
}

/* Firebase 讀取 */

let danmuPool=[];

const messagesQuery=query(messagesRef,limitToLast(50));

onChildAdded(messagesQuery,(data)=>{

const msg=data.val();

if(!msg?.content)return;

danmuPool.push(msg.content);

if(danmuPool.length>20){
danmuPool.shift();
}

});

/* 彈幕輪播 */

setInterval(()=>{

if(!danmuVisible)return;
if(danmuPool.length===0)return;

const text=danmuPool[Math.floor(Math.random()*danmuPool.length)];

createDanmu(text);

},2500);

/* 保底 */

if(danmuPool.length===0){
danmuPool.push("祁煜生日快樂 💙");
}

</script>

</body>
</html>
